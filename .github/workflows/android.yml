name: Android

on:
  push:
    branches: [main, "claude/**", "vajra/**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "core-rust/**"
      - "data/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "core-rust/**"
      - "data/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach builds to a GitHub Release on v* tags
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            core-rust/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('core-rust/Cargo.toml', 'core-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-cargo-

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.3.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ILLAKIYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/illakiya-release.jks"
            echo "ILLAKIYA_KEYSTORE_PATH=$RUNNER_TEMP/illakiya-release.jks" >> "$GITHUB_ENV"
          else
            echo "No ILLAKIYA_KEYSTORE_BASE64 secret: release builds will be unsigned."
          fi

      - name: Build
        working-directory: android
        env:
          ILLAKIYA_KEYSTORE_PASSWORD: ${{ secrets.ILLAKIYA_KEYSTORE_PASSWORD }}
          ILLAKIYA_KEY_ALIAS: ${{ secrets.ILLAKIYA_KEY_ALIAS }}
          ILLAKIYA_KEY_PASSWORD: ${{ secrets.ILLAKIYA_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ./gradlew --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.version.outputs.name }} \
            assembleDebug assembleRelease bundleRelease lintDebug

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: illakiya-android-${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
